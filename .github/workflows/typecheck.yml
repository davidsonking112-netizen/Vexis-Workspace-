name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  # Keep dev pushes serialized, but never let an obsolete PR revision block
  # validation of the current PR head.
  group: ${{ format('{0}-v2-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    # The upstream repository has Blacksmith runners; this fork uses
    # GitHub-hosted runners so validation cannot hang on unavailable labels.
    runs-on: ${{ github.repository_owner == 'anomalyco' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
